server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The SPA owns routing; unknown paths must return the shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build output is content-hashed, so it can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vendored theme, not content-hashed, so it cannot be cached immutably.
    # A short TTL plus nginx's ETag keeps revalidation cheap.
    location = /main.css {
        add_header Cache-Control "public, max-age=3600";
    }

    # The shell references those hashes, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
}
